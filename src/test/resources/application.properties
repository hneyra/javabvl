## Configuracion exclusiva de tests: nada toca la BD de desarrollo ni la red.
baseUrl=http://localhost
urlCotizaciones=${baseUrl}/v1/stock-quote/market
urlHora=${baseUrl}/v1/traded-amount/daily
xlsPath=${java.io.tmpdir}/javabvl-tests/
alarma=2
horaInicio=9:40:00
horaFin=16:30
intervalo=00:05:00

spring.datasource.url=jdbc:h2:mem:bvltest;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=sa
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop

logging.level.bvl=WARN
logging.level.org.hibernate.SQL=WARN
